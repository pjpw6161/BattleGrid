<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BattleGrid WebSocket Test</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 24px;
      color: #111827;
      background: #f9fafb;
    }

    button {
      margin: 0 8px 8px 0;
      padding: 8px 12px;
    }

    pre {
      min-height: 280px;
      padding: 16px;
      overflow: auto;
      background: #111827;
      color: #e5e7eb;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>BattleGrid WebSocket Test</h1>
  <p>Target: <code>ws://127.0.0.1:7777</code></p>

  <div>
    <button id="connect">Connect</button>
    <button id="sendPing">Send Ping</button>
    <button id="sendJoin">Send Join</button>
    <button id="sendInput">Send Input</button>
    <button id="sendFireInput">Send Fire Input</button>
    <button id="sendBodyShot">Send Body Shot</button>
    <button id="sendHeadshot">Send Headshot-like Shot</button>
    <button id="sendFireAtBot1">Send Fire At Bot 1</button>
    <button id="sendFireAtNearestBot">Send Fire At Nearest Bot</button>
    <button id="startFiring">Start Firing</button>
    <button id="stopFiring">Stop Firing</button>
    <button id="startMovingRight">Start Moving Right</button>
    <button id="startMovingToHealthPack1">Start Moving To HPack 1</button>
    <button id="stopMoving">Stop Moving</button>
    <button id="sendDebugRoom">Send Debug Room</button>
    <button id="sendDebugRestartMatch">Send Debug Restart Match</button>
    <button id="sendInvalid">Send Invalid JSON</button>
    <button id="close">Close</button>
  </div>

  <pre id="log"></pre>

  <script>
    const serverUrl = "ws://127.0.0.1:7777";
    const logElement = document.getElementById("log");
    let socket = null;
    let joinedPlayerId = 1;
    let inputSeq = 0;
    let moveTimer = null;
    let fireTimer = null;
    const seenEventIds = new Set();
    let arenaLogged = false;

    function log(message) {
      const timestamp = new Date().toLocaleTimeString();
      logElement.textContent += `[${timestamp}] ${message}\n`;
      logElement.scrollTop = logElement.scrollHeight;
    }

    function send(message) {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        log("Cannot send: socket is not connected.");
        return;
      }

      socket.send(message);
      log(`sent: ${message}`);
    }

    function sendInput(moveX, moveY, fire, options = {}) {
      inputSeq += 1;
      const shotDirX = options.shotDirX ?? 1;
      const shotDirY = options.shotDirY ?? 0;
      const shotDirZ = options.shotDirZ ?? 0;
      send(JSON.stringify({
        type: "input",
        seq: inputSeq,
        player_id: joinedPlayerId,
        move_x: moveX,
        move_y: moveY,
        aim_x: options.aimX ?? shotDirX,
        aim_y: options.aimY ?? shotDirY,
        shot_dir_x: shotDirX,
        shot_dir_y: shotDirY,
        shot_dir_z: shotDirZ,
        fire,
        reload: options.reload ?? false,
        ads: options.ads ?? false,
        sprint: options.sprint ?? false,
        jump: options.jump ?? false,
        ammo: options.ammo ?? 30,
        spread_deg: options.spreadDeg ?? 0
      }));
    }

    function logMatchAndScoreboard(message) {
      const match = message.match;
      const scoreboard = Array.isArray(message.scoreboard) ? message.scoreboard : [];
      if (match) {
        const timeLeft = Number(match.time_left ?? 0);
        const minutes = Math.floor(Math.max(0, timeLeft) / 60);
        const seconds = Math.floor(Math.max(0, timeLeft) % 60).toString().padStart(2, "0");
        const winner = match.winner_nickname || (match.winner_player_id ? `P${match.winner_player_id}` : "-");
        log(
          `match state=${match.state} time=${minutes}:${seconds} ` +
          `goal=${match.target_score} game_over=${match.game_over} winner=${winner} match_id=${match.match_id}`
        );
      }

      if (scoreboard.length > 0) {
        const summary = scoreboard
          .slice(0, 4)
          .map((entry) =>
            `${entry.nickname || "P" + entry.player_id}: score=${entry.score} ` +
            `K/D=${entry.kills}/${entry.deaths} bots=${entry.bot_kills} players=${entry.player_kills}`
          )
          .join(" | ");
        log(`scoreboard ${summary}`);
      }
    }

    function logEvents(message) {
      const events = Array.isArray(message.events) ? message.events : [];
      for (const event of events) {
        if (!event.event_id || seenEventIds.has(event.event_id)) {
          continue;
        }

        seenEventIds.add(event.event_id);
        log(`event #${event.event_id} ${event.type}: ${event.message}`);
      }
    }

    function logArenaLayout(message) {
      if (arenaLogged || !message.arena || !message.arena.bounds) {
        return;
      }

      arenaLogged = true;
      const arena = message.arena;
      const bounds = arena.bounds;
      const playerSpawns = Array.isArray(arena.player_spawns) ? arena.player_spawns.length : 0;
      const cores = Array.isArray(arena.target_cores) ? arena.target_cores.length : 0;
      const botSpawns = Array.isArray(arena.bot_spawns) ? arena.bot_spawns.length : 0;
      const healthPackSpawns = Array.isArray(arena.health_pack_spawns) ? arena.health_pack_spawns.length : 0;
      log(
        `arena x=${bounds.min_x}..${bounds.max_x} y=${bounds.min_y}..${bounds.max_y} ` +
        `player_spawns=${playerSpawns} cores=${cores} bot_spawns=${botSpawns} health_pack_spawns=${healthPackSpawns}`
      );
    }

    document.getElementById("connect").addEventListener("click", () => {
      if (socket && socket.readyState === WebSocket.OPEN) {
        log("Already connected.");
        return;
      }

      seenEventIds.clear();
      arenaLogged = false;
      socket = new WebSocket(serverUrl);
      socket.addEventListener("open", () => log("connected"));
      socket.addEventListener("message", (event) => {
        log(`received: ${event.data}`);

        try {
          const message = JSON.parse(event.data);
          if (message.type === "join_ok") {
            joinedPlayerId = message.player_id;
            log(`joined player_id=${joinedPlayerId}`);
          } else if (message.type === "match_restarted") {
            seenEventIds.clear();
            log(`match_restarted match_id=${message.match_id}`);
          } else if (message.type === "room_state") {
            log(
              `room_state players=${message.player_count ?? 0} ` +
              `targets=${message.target_count ?? 0} bots=${message.bot_count ?? 0} ` +
              `health_packs=${message.active_health_pack_count ?? 0}/${message.health_pack_count ?? 0} ` +
              `projectiles=${message.projectile_count ?? 0}`
            );
            logArenaLayout(message);
            logMatchAndScoreboard(message);
            logEvents(message);
          } else if (message.type === "snapshot") {
            const projectiles = Array.isArray(message.projectiles) ? message.projectiles : [];
            const targets = Array.isArray(message.targets) ? message.targets : [];
            const bots = Array.isArray(message.bots) ? message.bots : [];
            const healthPacks = Array.isArray(message.health_packs) ? message.health_packs : [];
            const players = Array.isArray(message.players) ? message.players : [];
            logArenaLayout(message);
            logMatchAndScoreboard(message);
            logEvents(message);
            const ownPlayer = players.find((player) => player.player_id === joinedPlayerId);
            if (ownPlayer) {
              log(
                `snapshot tick=${message.tick} player_hp=${ownPlayer.hp}/${ownPlayer.max_hp} ` +
                `alive=${ownPlayer.alive} invincible=${ownPlayer.invincible} ` +
                `score=${ownPlayer.score} kills=${ownPlayer.kills} deaths=${ownPlayer.deaths} ` +
                `target_kills=${ownPlayer.target_kills} bot_kills=${ownPlayer.bot_kills}`
              );
            }
            if (projectiles.length > 0) {
              const latest = projectiles[projectiles.length - 1];
              log(
                `snapshot tick=${message.tick} projectiles=${projectiles.length} ` +
                `latest=(${latest.x.toFixed(1)}, ${latest.y.toFixed(1)})`
              );
            }
            if (targets.length > 0) {
              const targetSummary = targets
                .map((target) => `T${target.target_id}:${target.alive ? target.hp + "/" + target.max_hp : "DEAD"}`)
                .join(" ");
              log(`snapshot tick=${message.tick} targets=${targets.length} ${targetSummary}`);
            }
            if (bots.length > 0) {
              const aliveBots = bots.filter((bot) => bot.alive).length;
              const botSummary = bots
                .slice(0, 4)
                .map((bot) => `B${bot.bot_id}:${bot.alive ? bot.hp + "/" + bot.max_hp : "DEAD"}`)
                .join(" ");
              log(`snapshot tick=${message.tick} bots=${aliveBots}/${bots.length} ${botSummary}`);
            }
            if (healthPacks.length > 0) {
              const activeHealthPacks = healthPacks.filter((pack) => pack.active).length;
              const healthPackSummary = healthPacks
                .map((pack) =>
                  `H${pack.health_pack_id}:${pack.active ? "+" + pack.heal_amount : "respawn " + pack.respawn_timer.toFixed(1)}`
                )
                .join(" ");
              log(`snapshot tick=${message.tick} health_packs=${activeHealthPacks}/${healthPacks.length} ${healthPackSummary}`);
            }
          }
        } catch {
          log("received non-json message");
        }
      });
      socket.addEventListener("close", () => {
        if (moveTimer) {
          clearInterval(moveTimer);
          moveTimer = null;
        }
        if (fireTimer) {
          clearInterval(fireTimer);
          fireTimer = null;
        }
        log("closed");
      });
      socket.addEventListener("error", () => log("socket error"));
    });

    document.getElementById("sendPing").addEventListener("click", () => {
      send(JSON.stringify({ type: "ping" }));
    });

    document.getElementById("sendJoin").addEventListener("click", () => {
      send(JSON.stringify({ type: "join", nickname: "player1" }));
    });

    document.getElementById("sendInput").addEventListener("click", () => {
      sendInput(1, 0, false);
    });

    document.getElementById("sendFireInput").addEventListener("click", () => {
      sendInput(0, 0, true);
    });

    document.getElementById("sendBodyShot").addEventListener("click", () => {
      sendInput(0, 0, true, {
        shotDirX: 1,
        shotDirY: 0,
        shotDirZ: 0,
        spreadDeg: 0
      });
    });

    document.getElementById("sendHeadshot").addEventListener("click", () => {
      sendInput(0, 0, true, {
        shotDirX: 1,
        shotDirY: 0,
        shotDirZ: 0.6,
        spreadDeg: 0,
        ads: true
      });
    });

    document.getElementById("sendFireAtBot1").addEventListener("click", () => {
      // Player 1 starts at (-1200, 0). Bot 1 starts at (-300, 300).
      sendInput(0, 0, true, {
        shotDirX: 0.95,
        shotDirY: 0.32,
        shotDirZ: 0,
        spreadDeg: 0,
        ads: true
      });
    });

    document.getElementById("sendFireAtNearestBot").addEventListener("click", () => {
      // Useful after joining: this aims from P1 toward the central bot cluster.
      sendInput(0, 0, true, {
        shotDirX: 0.95,
        shotDirY: 0.32,
        shotDirZ: 0,
        spreadDeg: 0,
        ads: true
      });
    });

    document.getElementById("startFiring").addEventListener("click", () => {
      if (fireTimer) {
        log("Already sending fire input.");
        return;
      }

      sendInput(0, 0, true);
      fireTimer = setInterval(() => sendInput(0, 0, true), 250);
    });

    document.getElementById("stopFiring").addEventListener("click", () => {
      if (fireTimer) {
        clearInterval(fireTimer);
        fireTimer = null;
      }

      sendInput(0, 0, false);
    });

    document.getElementById("startMovingRight").addEventListener("click", () => {
      if (moveTimer) {
        log("Already sending movement input.");
        return;
      }

      sendInput(1, 0, false);
      moveTimer = setInterval(() => sendInput(1, 0, false), 100);
    });

    document.getElementById("startMovingToHealthPack1").addEventListener("click", () => {
      if (moveTimer) {
        log("Already sending movement input.");
        return;
      }

      log("Moving toward HPack 1 at approximately (-1300, 700). Pickup only consumes it if player HP is below max.");
      sendInput(-0.15, 1, false);
      moveTimer = setInterval(() => sendInput(-0.15, 1, false), 100);
    });

    document.getElementById("stopMoving").addEventListener("click", () => {
      if (moveTimer) {
        clearInterval(moveTimer);
        moveTimer = null;
      }

      sendInput(0, 0, false);
    });

    document.getElementById("sendDebugRoom").addEventListener("click", () => {
      send(JSON.stringify({ type: "debug_room" }));
    });

    document.getElementById("sendDebugRestartMatch").addEventListener("click", () => {
      send(JSON.stringify({ type: "debug_restart_match" }));
    });

    document.getElementById("sendInvalid").addEventListener("click", () => {
      send("{ invalid json");
    });

    document.getElementById("close").addEventListener("click", () => {
      if (socket) {
        socket.close();
      }
    });
  </script>
</body>
</html>
